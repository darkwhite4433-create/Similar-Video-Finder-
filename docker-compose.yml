version: '3.8'

services:
  videofind-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videofind-ai
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_MODEL=gemini-2.0-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - app_data:/app/data

volumes:
  app_data:
